<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header with Sidebar</title>
    <style>
        
        
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

         
        header {
            background-color: #eaddd8;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: relative;
            z-index: 500;
        }

        .left-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .menu-toggle {
            background: none;
            border: none;
            font-size: 30px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .Logo {
            display: flex;
            align-items: center;
            cursor: pointer;
            gap: 10px;
        }

        .Logo img {
            height: 50px; 
            width: auto;
        }

        .Logo h2 {
            margin: 0;
            font-size: 18px;
            line-height: 1.2;
            color: #333;
        }

          
        .show {
            display: block;
            display: flex;
            justify-content: space-between; 
            gap: 10px;
        }

        .show_buttons {
            background: none;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            padding: 10px 15px;
            transition: 0.3s;
            color: #333;
        }

        .show_buttons:hover {
            background-color: rgba(0,0,0,0.05);
            border-radius: 5px;
        }

        
        .sidebar {
            height: 100%;
            width: 250px;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: -250px;  
            background-color: #eaddd8;
            overflow-x: hidden;
            transition: 0.3s;
            padding-top: 60px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.2);
        }

        .sidebar a {
            padding: 15px 25px;
            text-decoration: none;
            font-size: 18px;
            color: #000;
            display: block;
            font-weight: bold;
            transition: 0.2s;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .sidebar a:hover {
            background-color: #dccbc4;
            padding-left: 35px;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 36px;
            cursor: pointer;
        }

        .sidebar.active {
            left: 0;
        }

        .overlay {
            display: none;
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background-color: rgba(0,0,0,0.5);
            z-index: 900;
        }

        .overlay.active {
            display: block;
        }

         
        @media screen and (max-width: 768px) {
            .show {
                display: none;  
            }
        }
    </style>
</head>
<body>

    <header>
        <!-- <div class="left-section"> -->
            <button class="menu-toggle" onclick="toggleSidebar()">☰</button>

            <div class="Logo" onclick="window.location.href='http://localhost/project%20of%20Local%20soccer%20league%20manager/html/SuperLeague.php'">
                <img src="http://localhost/project%20of%20Local%20soccer%20league%20manager/Logo/logo.jpg" class="logo" alt="Logo">
                <h2>Super <br>League</h2>
            </div>
        <!-- </div> -->

        <div class="show">
            <button class="show_buttons" onclick="window.location.href='http://localhost/project%20of%20Local%20soccer%20league%20manager/html/Matches.php'">Matches</button>
            <button class="show_buttons" onclick="window.location.href='http://localhost/project%20of%20Local%20soccer%20league%20manager/html/Table.php'">Table</button>
            <button class="show_buttons" onclick="window.location.href='http://localhost/project%20of%20Local%20soccer%20league%20manager/html/Clubs.php'">Clubs</button>
            <button class="show_buttons" onclick="window.location.href='http://localhost/project%20of%20Local%20soccer%20league%20manager/html/Players.php'">Players</button>
            <button class="show_buttons" onclick="window.location.href='http://localhost/project%20of%20Local%20soccer%20league%20manager/html/Transfers.php'">Transfers</button>
            <button class="show_buttons" onclick="window.location.href='http://localhost/project%20of%20Local%20soccer%20league%20manager/html/AddMatch.php'">Add Match</button>
        </div>
    </header>

    <nav id="sidebar" class="sidebar">
        <span class="close-btn" onclick="toggleSidebar()">&times;</span>
        <a href="http://localhost/project%20of%20Local%20soccer%20league%20manager/html/Matches.php">Matches</a>
        <a href="http://localhost/project%20of%20Local%20soccer%20league%20manager/html/Table.php">Table</a>
        <a href="http://localhost/project%20of%20Local%20soccer%20league%20manager/html/Clubs.php">Clubs</a>
        <a href="http://localhost/project%20of%20Local%20soccer%20league%20manager/html/Players.php">Players</a>
        <a href="http://localhost/project%20of%20Local%20soccer%20league%20manager/html/Transfers.php">Transfers</a>
        <a href="http://localhost/project%20of%20Local%20soccer%20league%20manager/html/AddMatch.php">Add Match</a>
    </nav>
    
    <div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById("sidebar");
            const overlay = document.getElementById("overlay");
            sidebar.classList.toggle("active");
            overlay.classList.toggle("active");
        }
    </script>

</body>
</html>
